<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云游智导 · 开始体验</title><link rel="stylesheet" href="../../assets/css/material-icons.css"><link rel="stylesheet" href="../../assets/css/platform.css"><link rel="stylesheet" href="../../assets/css/landing.css"><link rel="stylesheet" href="../../assets/css/voice-controls.css"></head>
<body class="landing-page">
  <header class="landing-top"><div class="app-brand"><span class="material-icons brand-icon">landscape</span><strong>云游智导</strong><span>灵山胜境导览服务</span></div><div class="status">服务正常</div></header>
  <section class="landing-visual"><img src="../../assets/images/digital-guide-main.webp" alt="导游讲解画面"><div class="visual-copy"><span class="eyebrow">LINGSHAN GUIDE</span><h1>每一次抵达，<br>都有清楚的讲解。</h1><p>可以听讲解、问景点、拍照识景，也可以按时间和体力安排路线。</p></div></section>
  <main class="identity-panel"><div><span class="eyebrow">选择身份</span><h2>开始你的导览</h2><p class="muted">进入游客导览、团长控制台或景区运营后台。</p></div><div class="identity-list"><button id="btn-visitor" class="identity-option"><span class="material-icons">person</span><span><strong>我是游客</strong><small>可独自使用，也可加入团队导览</small></span><span class="material-icons">arrow_forward</span></button><button id="btn-leader" class="identity-option"><span class="identity-icon-wrap"><img class="identity-icon" src="../../assets/icons/groups.svg" alt=""></span><span><strong>我是团长</strong><small>创建团队并控制讲解进程</small></span><span class="material-icons">arrow_forward</span></button><button id="btn-admin" class="identity-option"><span class="identity-icon-wrap"><img class="identity-icon" src="../../assets/icons/admin_panel_settings.svg" alt=""></span><span><strong>景区管理员</strong><small>维护景点资料、讲解形象和运营数据</small></span><span class="material-icons">arrow_forward</span></button></div><div class="capability-row"><span>景点问答</span><span>路线建议</span><span>语音讲解</span><span>游客服务</span></div></main>
  <footer class="landing-foot"><span>讲解参考景区资料</span><span>公共问答与私人服务分开</span><span>身体不适时请优先联系现场工作人员</span></footer>
  <div id="register-modal" class="modal-layer hidden"><div id="register-dialog" class="modal-card enter"><div class="page-head"><div><span class="eyebrow">注册体验</span><h2 id="modal-title">输入你的名字</h2></div><button id="modal-close" class="icon-btn"><span class="material-icons">close</span></button></div><p class="muted">输入昵称即可创建临时身份。</p><input id="modal-name" class="field" placeholder="请输入昵称（至少 2 个字）"><label id="modal-voice-group" class="visitor-voice-field hidden" for="modal-voice"><span>选择你喜欢的讲解音色</span><select id="modal-voice" class="field"><option value="guide_female">温暖女声</option><option value="xiaomei">活力女声</option><option value="guide_male">沉稳男声</option><option value="xiaowei">专业男声</option></select><small>进入后仍可随时更换</small></label><p id="modal-error" class="hidden" style="color:var(--p-danger);font-size:12px"></p><button id="modal-submit" class="btn primary" style="width:100%;margin-top:14px">开始导览</button></div></div>
  <div id="admin-modal" class="modal-layer hidden"><div id="admin-dialog" class="modal-card enter"><div class="page-head"><div><span class="eyebrow">后台验证</span><h2>管理员登录</h2></div><button id="admin-modal-close" class="icon-btn"><span class="material-icons">close</span></button></div><input id="admin-passcode" type="password" class="field" placeholder="请输入管理密码"><p id="admin-error" class="hidden" style="color:var(--p-danger);font-size:12px">密码错误</p><button id="admin-submit" class="btn primary" style="width:100%;margin-top:14px">进入运营后台</button></div></div>
  <script src="../../assets/js/config.js"></script><script src="../../assets/js/state.js"></script><script src="../../assets/js/api-client.js"></script><script src="../../assets/js/auth.js"></script><script src="../../assets/js/ui.js"></script><script src="../../assets/js/router.js"></script><script src="../../assets/js/components.js"></script><script src="../../assets/js/pages/landing.js"></script>
</body></html>
