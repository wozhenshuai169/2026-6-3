<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>图片识景 · 智慧导览</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols from jsDelivr -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: { extend: {
            colors: { primary:"#E07B3C",surface:"#FFFFFF",background:"#FAFAF7",border:"#E8E8E6","text-primary":"#1A1A1C","text-secondary":"#6F6F6F","text-tertiary":"#A0A0A0",success:"#4ADE80",danger:"#F87171" },
            fontFamily:{ serif:["Noto Serif SC","serif"],sans:["Noto Sans SC","sans-serif"],mono:["Inter","sans-serif"] },
            borderRadius:{ DEFAULT:"0.25rem",lg:"0.5rem",xl:"12px",full:"9999px" },
            spacing:{ xs:"4px",sm:"8px",md:"16px",lg:"24px",xl:"32px",gutter:"24px" }
        }}
    }
</script>
<link rel="stylesheet" href="../../assets/css/material-icons.css"/>
<style>
    body{background:#FAFAF7;color:#1A1A1C;font-family:"Noto Sans SC",sans-serif}
    
    @keyframes spin{to{transform:rotate(360deg)}} .animate-spin{animation:spin 1s linear infinite}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn .3s ease-out}
    .loading-spinner{width:24px;height:24px;border:2px solid #E07B3C;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
</style>
</head>
<body class="min-h-screen flex flex-col max-w-2xl mx-auto w-full">

<!-- Header -->
<header class="h-[56px] bg-white border-b border-border flex items-center justify-between px-4 sticky top-0 z-10">
    <a href="../user-portal/index.html" class="w-8 h-8 flex items-center justify-center text-text-primary hover:opacity-70 transition-opacity">
        <span class="material-icons">arrow_back</span>
    </a>
    <h1 class="text-base font-medium" style="font-family:'Noto Serif SC',serif">图片识景</h1>
    <div class="w-8"></div>
</header>

<!-- Main -->
<main class="flex-1 p-4 flex flex-col gap-4">
    <!-- Upload Zone -->
    <div id="upload-zone" class="border-2 border-dashed border-border rounded-xl p-8 text-center cursor-pointer hover:border-primary transition-colors bg-white">
        <span class="material-icons text-[48px] text-text-tertiary mb-3">image_search</span>
        <p class="text-sm text-text-secondary mb-1">点击上传或拖拽图片</p>
        <p class="text-xs text-text-tertiary">支持 jpg、png、webp · 最大 10MB</p>
        <input id="file-input" type="file" accept="image/*" class="hidden">
    </div>
    <!-- Preview -->
    <div id="preview-area" class="hidden bg-white border border-border rounded-xl overflow-hidden">
        <img id="preview-img" class="w-full max-h-64 object-contain bg-black/5" alt="">
    </div>
    <!-- Loading -->
    <div id="loading-area" class="hidden text-center py-8">
        <div class="loading-spinner mb-3"></div>
        <p class="text-sm text-text-secondary">AI 正在识别图片中的景点...</p>
    </div>
    <!-- Result -->
    <div id="result-area" class="hidden bg-white border border-border rounded-xl p-lg fade-in flex flex-col gap-4">
        <div class="flex items-center gap-3">
            <span class="w-12 h-12 rounded-full bg-[#E07B3C]/10 text-primary flex items-center justify-center">
                <span class="material-icons text-[28px]">travel_explore</span>
            </span>
            <div>
                <h2 id="result-spot-name" class="text-lg font-medium" style="font-family:'Noto Serif SC',serif"></h2>
                <div class="flex items-center gap-2 mt-1">
                    <span id="result-confidence" class="text-xs text-text-secondary"></span>
                    <span id="result-category" class="text-xs px-2 py-0.5 bg-primary/10 text-primary rounded-full"></span>
                </div>
            </div>
        </div>
        <p id="result-description" class="text-sm text-text-secondary leading-relaxed"></p>
        <div id="result-features" class="flex flex-wrap gap-1"></div>
        <div id="result-related" class="border-t border-border pt-4">
            <h3 class="text-xs font-medium text-text-tertiary uppercase mb-2">相关景点</h3>
            <div id="related-list" class="flex flex-col gap-2"></div>
        </div>
    </div>
    <!-- Error -->
    <div id="error-area" class="hidden bg-white border border-[#F87171] rounded-xl p-6 text-center">
        <span class="material-icons text-[40px] text-[#F87171] mb-2">error_outline</span>
        <p id="error-message" class="text-sm text-text-secondary mb-4"></p>
        <button id="retry-btn" class="px-4 py-2 border border-border rounded-lg text-sm hover:border-primary transition-colors">重新上传</button>
    </div>
</main>

<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/state.js"></script>
<script src="../../assets/js/api-client.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/pages/vision.js"></script>
</body></html>
