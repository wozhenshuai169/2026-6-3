<html lang="zh-CN"><head>

<style>
    ::-webkit-scrollbar{display:none}
    *{-ms-overflow-style:none;scrollbar-width:none}
    body{min-height:max(884px,100dvh)}
    @keyframes spin{to{transform:rotate(360deg)}}.animate-spin{animation:spin 1s linear infinite}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .msg-animate{animation:fadeIn 0.3s ease-out}
    @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.3}}
    .recording-dot{animation:pulse-dot 0.8s ease-in-out infinite}
    .loading-spinner{width:20px;height:20px;border:2px solid #E07B3C;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block}
</style>
<link rel="stylesheet" href="../../assets/css/studio-command.css"/>
</head>
<body class="bg-chat-bg text-chat-text-dark font-body-md h-screen w-screen overflow-hidden flex flex-col antialiased">

<!-- Navbar -->
<header class="h-[52px] min-h-[52px] bg-white border-b border-chat-border flex items-center justify-between px-4 z-10 shrink-0">
    <button id="btn-back" class="w-8 h-8 flex items-center justify-center text-chat-text-dark opacity-80 hover:opacity-100 transition-opacity">
        <span class="material-symbols-outlined" style="font-size:20px">close</span>
    </button>
    <h1 class="font-headline-md text-[16px] font-medium tracking-wide">AI私人助手</h1>
    <button id="btn-more" class="w-8 h-8 flex items-center justify-center text-chat-text-dark opacity-80 hover:opacity-100 transition-opacity">
        <span class="material-symbols-outlined" style="font-size:20px">more_horiz</span>
    </button>
</header>

<!-- Privacy Notice -->
<div class="h-[28px] min-h-[28px] bg-chat-accent-bg flex items-center justify-center shrink-0">
    <p class="text-[11px] text-chat-accent font-medium flex items-center gap-1">
        <span class="material-symbols-outlined" style="font-size:14px;font-variation-settings:'FILL'1">lock</span>
        私密对话 · 仅你和AI可见
    </p>
</div>

<!-- Chat Content -->
<main id="chat-container" class="flex-1 overflow-y-auto px-4 py-6 flex flex-col gap-4">
    <!-- Dynamically populated -->
</main>

<!-- Quick Actions -->
<div class="shrink-0 bg-white border-t border-chat-border flex flex-col">
    <div class="w-full overflow-x-auto py-3 px-4 flex gap-2 border-b border-chat-border/50 bg-chat-bg/50">
        <button class="quick-btn whitespace-nowrap px-3 py-1.5 bg-white border border-chat-border rounded-full text-[13px] text-chat-text-dark hover:border-chat-accent transition-colors flex items-center gap-1" data-question="最近的洗手间在哪里？"><span class="material-symbols-outlined text-[17px]">wc</span>洗手间在哪</button>
        <button class="quick-btn whitespace-nowrap px-3 py-1.5 bg-white border border-chat-border rounded-full text-[13px] text-chat-text-dark hover:border-chat-accent transition-colors flex items-center gap-1" data-question="我累了，附近有可以休息的地方吗？"><span class="material-symbols-outlined text-[17px]">chair</span>附近休息区</button>
        <button class="quick-btn whitespace-nowrap px-3 py-1.5 bg-white border border-chat-border rounded-full text-[13px] text-chat-text-dark hover:border-chat-accent transition-colors flex items-center gap-1" data-question="有没有不用爬太多台阶的路线？"><span class="material-symbols-outlined text-[17px]">directions_walk</span>不想爬太多台阶</button>
        <button class="quick-btn whitespace-nowrap px-3 py-1.5 bg-white border border-chat-border rounded-full text-[13px] text-chat-text-dark hover:border-chat-accent transition-colors flex items-center gap-1" data-question="这个景点最佳拍照位置在哪里？">📸 最佳拍照点</button>
    </div>

    <!-- Input Bar -->
    <div class="h-[72px] flex items-center px-4 gap-3 bg-white pb-safe">
        <button id="btn-mic" class="w-10 h-10 rounded-full bg-chat-bubble-gray flex items-center justify-center text-chat-text-dark hover:bg-chat-border transition-colors shrink-0">
            <span class="material-symbols-outlined" style="font-size:22px">mic</span>
        </button>
        <div class="flex-1 h-10 bg-chat-bubble-gray rounded-full px-4 flex items-center border border-transparent focus-within:border-chat-accent focus-within:bg-white transition-all">
            <input id="chat-input" class="w-full bg-transparent border-none focus:ring-0 text-[15px] p-0 placeholder:text-chat-text-muted text-chat-text-dark" placeholder="想问什么？" type="text"/>
        </div>
        <button id="btn-send" class="w-10 h-10 rounded-full bg-chat-accent flex items-center justify-center text-white hover:opacity-90 transition-opacity shrink-0 shadow-sm">
            <span class="material-symbols-outlined" style="font-size:20px;transform:translateX(1px);font-variation-settings:'FILL'1">send</span>
        </button>
    </div>
</div>

<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/state.js"></script>
<script src="../../assets/js/api-client.js"></script>
