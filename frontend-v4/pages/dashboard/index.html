<!DOCTYPE html>
<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>数据大屏 · 智慧导览</title>

                "on-primary-fixed":"#1b1b1d","on-secondary-container":"#6e2f00","primary-fixed":"#e4e2e4",
                "tertiary-container":"#1a1c1b","on-secondary-fixed":"#331200","surface-bright":"#fbf9f9",
                "error":"#ba1a1a","surface":"#1C1C1E","outline-variant":"#2E2E30","secondary-fixed":"#ffdbca",
                "tertiary-fixed":"#e2e3e1","secondary":"#E07B3C","on-surface-variant":"#8E8E90",
                "on-background":"#ECECED","surface-dim":"#dbdad9","surface-container-lowest":"#1C1C1E",

<style>
    body{background:#1C1C1E;color:#ECECED;font-family:Inter,sans-serif}
    .material-symbols-outlined{font-variation-settings:'FILL'0,'wght'300,'GRAD'0,'opsz'24}
    .card{border-radius:12px;padding:20px;background:#242426;border:1px solid #2E2E30}
    .tabular-nums{font-variant-numeric:tabular-nums}
    .custom-scrollbar::-webkit-scrollbar{width:4px}.custom-scrollbar::-webkit-scrollbar-track{background:transparent}.custom-scrollbar::-webkit-scrollbar-thumb{background:#2E2E30;border-radius:10px}
    .skeleton{background:linear-gradient(90deg,#2E2E30 25%,#3A3A3C 50%,#2E2E30 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    @keyframes spin{to{transform:rotate(360deg)}}.animate-spin{animation:spin 1s linear infinite}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .loading-spinner{width:20px;height:20px;border:2px solid #E07B3C;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block}
</style>
<link rel="stylesheet" href="../../assets/css/studio-command.css"/>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<!-- Top Status Bar -->
<header class="h-[56px] min-h-[56px] bg-background border-b border-outline-variant flex items-center justify-between px-6 shrink-0">
    <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[#E07B3C] text-[20px]">landscape</span>
        <span class="font-headline-md text-[18px] text-on-background">智慧导览 · 数据大屏</span>
    </div>
    <div class="flex items-center gap-4">
        <span id="clock" class="tabular-nums text-sm text-on-surface-variant"></span>
        <span class="text-xs text-on-surface-variant">数据每30秒刷新</span>
        <button id="btn-refresh" class="w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-on-background transition-colors">
            <span class="material-symbols-outlined text-[18px]">refresh</span>
        </button>
    </div>
</header>

<!-- Main Content -->
<main class="flex-1 overflow-y-auto custom-scrollbar p-6 flex flex-col gap-4">

    <!-- Row 1: KPI Cards -->
    <div class="grid grid-cols-4 gap-4" id="kpi-row">
        <div class="card" id="kpi-1"><div class="loading-spinner mx-auto"></div></div>
        <div class="card" id="kpi-2"><div class="loading-spinner mx-auto"></div></div>
        <div class="card" id="kpi-3"><div class="loading-spinner mx-auto"></div></div>
        <div class="card" id="kpi-4"><div class="loading-spinner mx-auto"></div></div>
    </div>

    <!-- Row 2: Chart + Hot Questions -->
    <div class="grid grid-cols-[3fr_2fr] gap-4" style="height:280px;">
        <div class="card flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <span class="text-sm font-medium text-on-background">问答趋势 · 今日</span>
                <div class="flex items-center gap-4 text-xs">
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#E07B3C]"></span> 公共问题</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#8E8E90]"></span> 私人问题</span>
                </div>
            </div>
            <canvas id="trend-chart" class="flex-1 w-full"></canvas>
        </div>
        <div class="card flex flex-col">
            <span class="text-sm font-medium text-on-background mb-4">热门问题 Top 5</span>
            <ol id="hot-questions-list" class="flex flex-col gap-3 flex-1 overflow-y-auto custom-scrollbar text-sm"></ol>
        </div>
    </div>

    <!-- Row 3: Secondary Cards -->
    <div class="grid grid-cols-3 gap-4" style="height:220px;">
        <!-- Active Rooms -->
        <div class="card flex flex-col" id="rooms-card">
            <span class="text-xs text-on-surface-variant uppercase tracking-wider mb-2">活跃房间</span>
            <div id="rooms-content"><div class="loading-spinner mx-auto mt-4"></div></div>
        </div>
        <!-- Sentiment -->
        <div class="card flex flex-col text-center justify-center" id="sentiment-card">
            <span class="text-xs text-on-surface-variant uppercase tracking-wider mb-2">满意度</span>
            <div id="sentiment-content"><div class="loading-spinner mx-auto"></div></div>
        </div>
        <!-- Recent Q&A Log -->
        <div class="card flex flex-col overflow-hidden" id="log-card">
            <span class="text-xs text-on-surface-variant uppercase tracking-wider mb-2">最近问答日志</span>
            <div id="log-content" class="flex-1 overflow-y-auto custom-scrollbar text-xs"></div>
        </div>
    </div>

</main>

<!-- Bottom Status Bar -->
<footer class="h-[32px] min-h-[32px] bg-[#1E1E20] flex items-center justify-center shrink-0">
    <span id="footer-status" class="text-xs text-on-surface-variant">系统运行中 · 加载中...</span>
</footer>

<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/state.js"></script>
<script src="../../assets/js/api-client.js"></script>
<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/components.js"></script>
<script src="../../assets/js/pages/dashboard.js"></script>
<script src="../../assets/js/studio-command.js"></script>
</body></html>
