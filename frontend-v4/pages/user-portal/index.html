<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云游智导 · 实时导览</title><link rel="stylesheet" href="../../assets/css/tailwind.generated.css"><link rel="stylesheet" href="../../assets/css/material-icons.css"><link rel="stylesheet" href="../../assets/css/platform.css"><link rel="stylesheet" href="../../assets/css/visitor-page.css"></head><body class="app-page" id="page-body">
<link rel="stylesheet" href="../../assets/css/voice-controls.css">
<link rel="stylesheet" href="../../assets/css/feedback-controls.css">
<header class="app-topbar"><div class="app-brand"><span class="material-icons brand-icon">landscape</span><strong>云游智导</strong><span>游客导览</span></div><nav class="app-nav"><a class="active">实时导览</a><a href="../recommend/index.html">路线规划</a><a href="../vision/index.html">图像识景</a><a href="../ai-assistant/index.html">私人问答</a></nav><div class="app-actions"><label class="visitor-voice-control" for="visitor-voice"><span class="material-icons">record_voice_over</span><select id="visitor-voice" aria-label="选择讲解音色"><option value="guide_female">温暖女声</option><option value="xiaomei">活力女声</option><option value="guide_male">沉稳男声</option><option value="xiaowei">专业男声</option></select></label><span id="spot-chip" class="chip hidden"><span class="material-icons">location_on</span><span id="spot-chip-name">—</span></span><button onclick="location.href='../landing/index.html'"><span class="material-icons">home</span>切换身份</button><button id="menu-toggle"><span class="material-icons">apps</span>更多功能</button></div></header>
<main class="visitor-layout"><aside class="tour-side"><div><span class="eyebrow">CURRENT TOUR</span><h2>我的导览</h2></div><section id="route-progress-bar" class="route-progress hidden"><div><strong>路线进度</strong><span id="route-progress-text">—</span></div><div class="progress-track"><div id="route-progress-fill"></div></div><div id="route-spots-pills"></div></section><section id="spot-info-card" class="surface spot-card hidden"><div><small>当前景点</small><strong id="spot-info-name">—</strong><p id="spot-info-desc">加入房间后显示</p></div></section><section class="members"><div class="member-head"><h3>同行游客</h3><span class="status">在线</span></div><div id="member-list-container"></div></section><section class="feedback"><h3>这次讲解怎么样？</h3><div><button class="feedback-star" data-score="1" aria-label="1星">★</button><button class="feedback-star" data-score="2" aria-label="2星">★</button><button class="feedback-star" data-score="3" aria-label="3星">★</button><button class="feedback-star" data-score="4" aria-label="4星">★</button><button class="feedback-star" data-score="5" aria-label="5星">★</button></div><select id="feedback-tag" class="field feedback-field"><option value="">选择反馈主题（可选）</option><option>讲解内容</option><option>语音体验</option><option>路线推荐</option><option>服务设施</option><option>图片识别</option><option>其他</option></select><textarea id="feedback-comment" class="field feedback-field" maxlength="500" rows="3" placeholder="还可以告诉我们具体感受（可选）"></textarea><button id="feedback-submit" class="btn soft" type="button">提交反馈</button></section></aside>
<section class="tour-stage"><div id="avatar-mode" class="avatar-mode"><div id="avatar-container" class="digital-stage" data-status="idle" data-emotion="friendly"><img src="../../assets/images/digital-guide-main.webp" alt="导游讲解画面"><div class="avatar-state"><span class="status"><span id="avatar-status-label">待命中</span></span><span>当前讲解状态</span></div><button id="btn-switch-text" class="avatar-text-switch" type="button"><span class="material-icons">chat</span>文字问答</button><div id="narration-banner" class="narration"><small>导游讲解</small><p id="narration-text">等待讲解开始…</p></div></div></div><div id="text-mode" class="text-mode hidden"><div class="mode-head"><div><span class="eyebrow">公共问答</span><h2>公共问答与讲解</h2></div><button id="btn-switch-avatar" class="btn"><span class="material-icons">face</span>返回讲解画面</button></div><div id="public-chat-area" class="public-chat"></div></div><footer class="question-bar"><button id="btn-voice" class="voice-btn" aria-label="语音提问"><span class="material-icons">mic</span><span>按住说话</span></button><input id="public-chat-input" class="field" placeholder="输入景区历史、文化或景点问题…"><button id="public-chat-send" class="btn primary"><span class="material-icons">arrow_upward</span>发送</button></footer></section>
<aside class="service-side"><section class="service-head"><span class="eyebrow">游客服务</span><h2>导览服务</h2><p>查找位置、附近设施和求助入口。</p></section><button class="service-item" onclick="Aurelian.ui.toast('已重新获取当前位置','success')"><span class="material-icons">my_location</span><span><strong>重新定位</strong><small>位置不准确时可用地标校准</small></span><span class="material-icons">chevron_right</span></button><button class="service-item" onclick="document.getElementById('fn-map').click()"><span class="material-icons">near_me</span><span><strong>附近设施</strong><small>洗手间、休息区、服务中心</small></span><span class="material-icons">chevron_right</span></button><button class="service-item" onclick="location.href='../ai-assistant/index.html'"><span><span class="svg-icon" style="--icon:url('../../assets/icons/health_and_safety.svg')" aria-hidden="true"></span></span><span><strong>身体不适或走散</strong><small>可在私人页面求助或通知团长</small></span><span class="material-icons">chevron_right</span></button><div class="latency-card"><span class="status">温馨提示</span><strong>需要帮助？</strong><small>紧急情况请直接联系现场工作人员</small></div></aside></main>
<div id="room-join-overlay" class="modal-layer hidden"><div class="modal-card enter"><span class="eyebrow">JOIN TOUR</span><h2>加入导览房间</h2><p class="muted">输入团长分享的房间号加入公共讲解；如不加入房间，请点击“独自导览”。</p><label class="join-voice-field" for="room-voice-select"><span>先选择讲解音色</span><select id="room-voice-select" class="field"><option value="guide_female">温暖女声</option><option value="xiaomei">活力女声</option><option value="guide_male">沉稳男声</option><option value="xiaowei">专业男声</option></select></label><input id="room-code-input" class="field" placeholder="请输入房间号"><p id="room-join-error" class="hidden" style="color:var(--p-danger);font-size:12px"></p><button id="room-join-btn" class="btn primary" style="width:100%;margin-top:14px">进入导览</button><button id="room-solo-btn" class="btn" style="width:100%;margin-top:10px">独自导览</button></div></div>
<div id="function-overlay" class="function-overlay hidden"><div class="function-head"><div><span class="eyebrow">更多服务</span><h2>更多导览功能</h2></div><button id="menu-close" class="icon-btn"><span class="material-icons">close</span></button></div><div class="function-grid"><button id="fn-knowledge"><span class="material-icons">menu_book</span><strong>景点资料</strong><small>查看当前景点的介绍和相关内容</small></button><button id="fn-map"><span class="material-icons">map</span><strong>附近景点</strong><small>查询周边景点与服务设施</small></button><button id="fn-ai"><span class="svg-icon" style="--icon:url('../../assets/icons/support_agent.svg')" aria-hidden="true"></span><strong>私人服务</strong><small>咨询个人需求，内容不在公共频道显示</small></button></div></div>
<div id="fn-result-modal" class="modal-layer hidden"><div class="modal-card"><div class="page-head"><h2 id="fn-result-title">详情</h2><button class="icon-btn" onclick="document.getElementById('fn-result-modal').classList.add('hidden')"><span class="material-icons">close</span></button></div><div id="fn-result-body"></div></div></div><audio id="tts-player" class="hidden"></audio>
<script src="../../assets/js/config.js"></script><script src="../../assets/js/state.js"></script><script src="../../assets/js/api-client.js"></script><script src="../../assets/js/auth.js"></script><script src="../../assets/js/ui.js"></script><script src="../../assets/js/router.js"></script><script src="../../assets/js/components.js"></script><script src="../../assets/js/pages/user-portal.js"></script></body></html>
