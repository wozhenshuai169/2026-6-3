<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云游智导 · 实时导览</title><link rel="stylesheet" href="../../assets/css/tailwind.generated.css"><link rel="stylesheet" href="../../assets/css/material-icons.css"><link rel="stylesheet" href="../../assets/css/platform.css"><link rel="stylesheet" href="../../assets/css/visitor-page.css"></head><body class="app-page" id="page-body">
<header class="app-topbar"><div class="app-brand"><span class="material-icons brand-icon">landscape</span><strong>云游智导</strong><span>游客导览</span></div><nav class="app-nav"><a class="active">实时导览</a><a href="../recommend/index.html">路线规划</a><a href="../vision/index.html">图像识景</a><a href="../ai-assistant/index.html">私人问答</a></nav><div class="app-actions"><span id="spot-chip" class="chip hidden"><span class="material-icons">location_on</span><span id="spot-chip-name">—</span></span><button id="menu-toggle"><span class="material-icons">apps</span>更多功能</button></div></header>
<main class="visitor-layout"><aside class="tour-side"><div><span class="eyebrow">CURRENT TOUR</span><h2>我的导览</h2></div><section id="route-progress-bar" class="route-progress hidden"><div><strong>路线进度</strong><span id="route-progress-text">—</span></div><div class="progress-track"><div id="route-progress-fill"></div></div><div id="route-spots-pills"></div></section><section id="spot-info-card" class="surface spot-card hidden"><img src="../../assets/images/main-hall.jpg" alt="当前景点"><div><small>当前景点</small><strong id="spot-info-name">—</strong><p id="spot-info-desc">加入房间后显示</p></div></section><section class="members"><div class="member-head"><h3>同行游客</h3><span class="status">在线</span></div><div id="member-list-container"></div></section><section class="feedback"><h3>这次讲解怎么样？</h3><div><button class="feedback-star" data-score="1">★</button><button class="feedback-star" data-score="2">★</button><button class="feedback-star" data-score="3">★</button><button class="feedback-star" data-score="4">★</button><button class="feedback-star" data-score="5">★</button></div></section></aside>
<section class="tour-stage"><div id="avatar-mode" class="avatar-mode"><div id="avatar-container" class="digital-stage" data-status="idle"><img src="../../assets/images/digital-guide-main.webp" alt="数字人导游"><div class="avatar-state"><span class="status"><span id="avatar-status-label">待命中</span></span><span>语音 · 表情 · 口型同步</span></div><div id="narration-banner" class="narration"><small>AI 正在讲解</small><p id="narration-text">等待 AI 开始讲解…</p></div></div><div class="stage-tools"><button id="btn-switch-text" class="btn"><span class="material-icons">chat</span>切换文字模式</button><button class="btn" onclick="location.href='../vision/index.html'"><span class="material-icons">image_search</span>拍照识景</button><button class="btn" onclick="location.href='../recommend/index.html'"><span class="material-icons">route</span>推荐路线</button><button class="btn" onclick="location.href='../ai-assistant/index.html'"><span class="material-icons">lock</span>私人服务</button></div></div><div id="text-mode" class="text-mode hidden"><div class="mode-head"><div><span class="eyebrow">PUBLIC CHANNEL</span><h2>公共问答与讲解</h2></div><button id="btn-switch-avatar" class="btn"><span class="material-icons">face</span>返回数字人</button></div><div id="public-chat-area" class="public-chat"></div></div><footer class="question-bar"><button id="btn-voice" class="voice-btn" aria-label="语音提问"><span class="material-symbols-outlined">mic</span><span>按住说话</span></button><input id="public-chat-input" class="field" placeholder="输入景区历史、文化或景点问题…"><button id="public-chat-send" class="btn primary"><span class="material-icons">arrow_upward</span>发送</button></footer></section>
<aside class="service-side"><section class="service-head"><span class="eyebrow">TRAVEL ASSIST</span><h2>导览服务</h2><p>定位、设施与异常情况处理。</p></section><button class="service-item" onclick="Aurelian.ui.toast('定位已更新：主展厅东侧','success')"><span class="material-icons">my_location</span><span><strong>重新定位</strong><small>GPS 弱信号时使用地标校准</small></span><span class="material-icons">chevron_right</span></button><button class="service-item" onclick="document.getElementById('fn-map').click()"><span class="material-icons">near_me</span><span><strong>附近设施</strong><small>洗手间、休息区、服务中心</small></span><span class="material-icons">chevron_right</span></button><button class="service-item" onclick="location.href='../ai-assistant/index.html'"><span class="material-icons">health_and_safety</span><span><strong>身体不适或走散</strong><small>进入私人服务并可通知团长</small></span><span class="material-icons">chevron_right</span></button><div class="latency-card"><span class="status">服务稳定</span><strong>&lt; 5 秒</strong><small>语音问答目标响应时间</small></div></aside></main>
<div id="room-join-overlay" class="modal-layer hidden"><div class="modal-card enter"><span class="eyebrow">JOIN TOUR</span><h2>加入导览房间</h2><p class="muted">输入团长分享的房间号，加入公共讲解。</p><input id="room-code-input" class="field" placeholder="请输入房间号"><p id="room-join-error" class="hidden" style="color:var(--p-danger);font-size:12px"></p><button id="room-join-btn" class="btn primary" style="width:100%;margin-top:14px">加入房间</button></div></div>
<div id="function-overlay" class="function-overlay hidden"><div class="function-head"><div><span class="eyebrow">MORE CAPABILITIES</span><h2>更多导览能力</h2></div><button id="menu-close" class="icon-btn"><span class="material-icons">close</span></button></div><div class="function-grid"><button id="fn-knowledge"><span class="material-icons">menu_book</span><strong>景点知识</strong><small>查看当前景点知识库资料</small></button><button id="fn-audio"><span class="material-icons">headphones</span><strong>音频导览</strong><small>生成并播放语音讲解</small></button><button id="fn-map"><span class="material-icons">map</span><strong>附近景点</strong><small>查询周边景点与服务设施</small></button><button id="fn-ai"><span class="material-icons">support_agent</span><strong>私人助手</strong><small>处理个人服务与隐私问题</small></button></div></div>
<div id="fn-result-modal" class="modal-layer hidden"><div class="modal-card"><div class="page-head"><h2 id="fn-result-title">详情</h2><button class="icon-btn" onclick="document.getElementById('fn-result-modal').classList.add('hidden')"><span class="material-icons">close</span></button></div><div id="fn-result-body"></div></div></div><audio id="tts-player" class="hidden"></audio>
<script src="../../assets/js/config.js"></script><script src="../../assets/js/state.js"></script><script src="../../assets/js/api-client.js"></script><script src="../../assets/js/auth.js"></script><script src="../../assets/js/ui.js"></script><script src="../../assets/js/router.js"></script><script src="../../assets/js/components.js"></script><script src="../../assets/js/pages/user-portal.js"></script></body></html>
