<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>云游智导 · 团长控制台</title>
  <link rel="stylesheet" href="../../assets/css/material-icons.css">
  <link rel="stylesheet" href="../../assets/css/warm-console.css">
</head>
<body class="console-page">
  <header class="console-topbar">
    <div class="brand"><span class="brand-mark material-icons">landscape</span><strong>云游智导</strong><span class="brand-divider"></span><span>团长控制台</span></div>
    <div class="top-actions"><span class="date">2026-07-12</span><button id="btn-share" class="text-action"><span class="material-icons">ios_share</span>分享房间</button><button class="icon-action" aria-label="紧急呼叫"><span class="material-icons">notifications_none</span></button><button class="icon-action" aria-label="更多"><span class="material-icons">more_horiz</span></button></div>
  </header>

  <main class="console-layout">
    <aside class="visitor-pane">
      <div class="pane-title"><h2 id="member-list-title">在线游客 0</h2><span id="member-count" class="sr-only">0人</span><span id="member-status-dot" class="online-dot"></span></div>
      <div class="room-meta"><span>房间</span><strong id="room-id-display">—</strong><button id="btn-copy-room" class="tiny-action"><span class="material-icons">content_copy</span></button></div>
      <ul id="member-list" class="visitor-list" aria-label="在线游客"></ul>
      <div id="pending-requests-row" class="request-summary hidden"><span id="pending-requests-text"></span><button id="btn-view-requests">查看</button></div>
      <div class="pane-footer"><button id="tab-all" class="text-action active">全部游客</button><button id="tab-requests" class="text-action">仅看请求</button></div>
    </aside>

    <section class="stage-pane">
      <div class="guide-stage">
        <img src="../../assets/images/digital-guide-main.webp" alt="数字人导游在天坛主展厅前进行讲解">
        <div class="stage-status"><span class="speaking-dot"></span><span id="ai-status-badge">待命</span><span id="ai-action-display">等待开始讲解</span></div>
        <p class="subtitle">各位朋友，欢迎来到主展厅。这里展现了中国古代建筑艺术的瑰宝……</p>
      </div>
      <div class="chapter-panel">
        <div class="chapter-current"><small>当前章节</small><strong id="current-spot-display">主展厅</strong><span id="progress-display">第 1 段 / 共 5 段</span></div>
        <ol class="chapter-track">
          <li class="done"><b>1</b><span>迎宾介绍</span></li>
          <li class="active"><b>2</b><span>主展厅</span></li>
          <li><b>3</b><span>文物精华</span></li>
          <li><b>4</b><span>建筑结构</span></li>
          <li><b>5</b><span>互动问答</span></li>
        </ol>
        <div class="chapter-time"><small>全程时长</small><strong>12:20</strong></div>
      </div>
    </section>

    <aside class="context-pane">
      <section class="context-block current-spot">
        <p class="eyebrow">当前景点 · <span id="scenic-area-display">主展厅</span></p>
        <img src="../../assets/images/main-hall.jpg" alt="主展厅">
        <p>了解主展厅的历史背景与建筑特色，探索它的文化价值。</p>
      </section>
      <section class="context-block route-block"><h3>路线进度</h3><div class="route-list"><button class="route-step active">主展厅 <span>正在讲解</span></button><button class="route-step">文物精华 <span>待讲解</span></button><button class="route-step">建筑结构 <span>待讲解</span></button></div></section>
      <section class="context-block request-card"><button id="btn-view-requests2"><span><span class="material-icons">chat_bubble_outline</span>私人请求 <b id="requests-badge">0</b></span><span class="material-icons">chevron_right</span></button></section>
      <div class="spot-picker"><button id="spot-selector-btn" aria-expanded="false"><span id="spot-selector-label">切换景点</span><span class="material-icons">expand_more</span></button><div id="spot-dropdown" class="spot-dropdown hidden"></div></div>
      <span id="route-name-display" class="sr-only">—</span>
    </aside>
  </main>

  <footer class="command-bar">
    <button id="btn-start" class="command primary"><span class="material-icons">play_arrow</span>开始讲解</button>
    <button id="btn-pause" class="command"><span class="material-icons">pause</span>暂停</button>
    <button id="btn-skip" class="command"><span class="material-icons">skip_next</span>跳过景点</button>
    <button id="btn-collect" class="command"><span class="material-icons">campaign</span>集合广播</button>
    <button id="btn-back" class="command compact"><span class="material-icons">arrow_back</span>退出</button>
    <button id="btn-view-requests" class="hidden"></button>
  </footer>

  <div id="route-modal" class="modal-layer hidden"><div class="modal-card"><p class="eyebrow">创建导览房间</p><h2>选择今天的导览路线</h2><div id="route-list" class="route-options"></div><div class="modal-actions"><button id="route-cancel" class="command">取消</button><button id="route-confirm" class="command primary" disabled>确认并创建</button></div></div></div>

  <script src="../../assets/js/config.js"></script><script src="../../assets/js/state.js"></script><script src="../../assets/js/api-client.js"></script><script src="../../assets/js/auth.js"></script><script src="../../assets/js/ui.js"></script><script src="../../assets/js/router.js"></script><script src="../../assets/js/components.js"></script><script src="../../assets/js/pages/guide-panel.js"></script>
</body>
</html>
