<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>云游智导 · 录制控制器</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#25211d;color:#f8f3eb;font-family:"Microsoft YaHei",sans-serif}.control{display:grid;grid-template-columns:560px 1fr;min-height:100vh}.panel{height:100vh;overflow:auto;padding:22px;border-right:1px solid #4b433c}.panel h1{margin:0 0 5px;font-size:20px}.panel p{margin:0 0 15px;color:#bfb4a8;font-size:12px}.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.steps button,.actions button{width:100%;padding:9px 10px;border:1px solid #5c5148;border-radius:9px;background:#342e29;color:#f8f3eb;text-align:left;cursor:pointer;font-size:12px}.steps button:hover{border-color:#c66b4f}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.actions button{border:0;background:#bd563c;text-align:center}.actions button:last-child{background:#665b52}.preview{display:grid;place-items:center;padding:24px}.preview-card{width:min(560px,100%);padding:42px;border:1px solid #4b433c;border-radius:24px;background:linear-gradient(145deg,#342e29,#2b2723);box-shadow:0 25px 70px rgba(0,0,0,.3)}.preview-card small{color:#c66b4f;font-weight:700;letter-spacing:.12em}.preview-card h2{margin:10px 0 12px;font-size:30px}.preview-card p{margin:0;color:#bfb4a8;line-height:1.8}.preview-card a{display:inline-flex;margin-top:24px;padding:13px 18px;border-radius:12px;background:#bd563c;color:#fff;text-decoration:none;font-weight:700}.sync-state{display:flex;align-items:center;gap:8px;margin-top:18px;color:#d8cec4;font-size:13px}.sync-state i{width:9px;height:9px;border-radius:50%;background:#65c98c;box-shadow:0 0 0 5px rgba(101,201,140,.12)}@media(max-width:900px){.control{grid-template-columns:1fr}.panel{height:auto}.preview{display:none}}
  </style>
</head>
<body>
  <main class="control">
    <section class="panel"><h1>比赛录制控制器</h1><p>该页面仅供录制人员使用，不进入成片。</p><div id="steps" class="steps"></div><div class="actions"><button id="play">自动播放</button><button id="reset">重置状态</button></div></section>
    <section class="preview"><article class="preview-card"><small>双窗口演示</small><h2>先打开演示画面</h2><p>演示画面与控制器会自动同步。录屏时只捕获演示窗口，本页用于人工切换步骤和控制节奏。</p><a id="open-preview" href="../competition-demo/index.html" target="competition-demo-preview">打开演示画面</a><div class="sync-state"><i></i>控制通道已就绪</div></article></section>
  </main>
  <script src="../../assets/js/demo/competition-fixture.js"></script>
  <script>
    (function(){
      var channel=new BroadcastChannel('competition-demo-control');
      var steps=document.getElementById('steps');
      COMPETITION_FIXTURE.steps.forEach(function(step,index){var button=document.createElement('button');button.textContent=(index+1)+'. '+step.label;button.addEventListener('click',function(){channel.postMessage({type:'go',index:index});});steps.appendChild(button);});
      document.getElementById('play').addEventListener('click',function(){channel.postMessage({type:'start'});});
      document.getElementById('reset').addEventListener('click',function(){channel.postMessage({type:'reset'});});
    })();
  </script>
</body>
</html>
