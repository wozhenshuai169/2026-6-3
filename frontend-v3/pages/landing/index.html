<!DOCTYPE html>

                    "inverse-primary": "#c8c6c8",

                    "primary-fixed-dim": "#c8c6c8",

<style>
    body { background-color: #FAFAF7; color: #1C1C1A; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
    .card-hover:hover { border-color: #E07B3C; }
    .card-hover:hover .icon-highlight { color: #E07B3C; }
    body { min-height: max(884px, 100dvh); }
    /* Skeleton loading */
    .skeleton { background: linear-gradient(90deg, #e8e8e6 25%, #f5f5f3 50%, #e8e8e6 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:8px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { opacity:0; transform:scale(0.95) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
    .animate-modal-in { animation: scaleIn 0.25s ease-out; }
</style>

<body class="min-h-screen flex flex-col items-center max-w-md mx-auto w-full relative">

<!-- TopAppBar -->
<header class="w-full top-0 border-b border-outline-variant bg-background flex items-center justify-between px-margin-mobile py-4 z-10 sticky">
    <button class="w-10 h-10 flex items-center justify-center text-on-surface hover:opacity-80 transition-opacity">
        <span class="material-symbols-outlined text-[24px]">account_balance</span>
    </button>
    <h1 class="font-headline-md text-headline-md tracking-widest text-primary uppercase absolute left-1/2 -translate-x-1/2">AURELIAN</h1>
    <div class="w-10 h-10"></div>
</header>

<!-- Main Content -->
<main class="flex-1 w-full px-margin-mobile py-3xl flex flex-col justify-center">
    <div class="text-center mb-2xl">
        <h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-sm">选择你的身份</h2>
        <p class="font-body-md text-body-md text-on-surface-variant">开启你的 AI 导览之旅</p>
    </div>
    <div class="flex flex-col gap-md">
        <!-- Card 1: Visitor -->
        <button id="btn-visitor" class="card-hover group flex flex-col items-center text-center p-xl bg-surface-container-lowest border border-outline rounded-2xl transition-all duration-300 w-full focus:outline-none focus:ring-1 focus:ring-secondary">
            <div class="w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center mb-lg group-hover:bg-orange-50 transition-colors duration-300">
                <span class="material-symbols-outlined text-[32px] icon-highlight text-on-surface-variant transition-colors duration-300">person</span>
            </div>
            <h3 class="font-headline-md text-headline-md text-on-surface mb-xs">游客</h3>
            <p class="font-body-md text-body-md text-on-surface-variant max-w-[200px]">跟随 AI 探索景区的每一个角落</p>
        </button>
        <!-- Card 2: Tour Leader -->
        <button id="btn-leader" class="card-hover group flex flex-col items-center text-center p-xl bg-surface-container-lowest border border-outline rounded-2xl transition-all duration-300 w-full focus:outline-none focus:ring-1 focus:ring-secondary">
            <div class="w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center mb-lg group-hover:bg-orange-50 transition-colors duration-300">
                <span class="material-symbols-outlined text-[32px] icon-highlight text-on-surface-variant transition-colors duration-300">groups</span>
            </div>
            <h3 class="font-headline-md text-headline-md text-on-surface mb-xs">团长</h3>
            <p class="font-body-md text-body-md text-on-surface-variant max-w-[200px]">管理您的团队，开启专业讲解之旅</p>
        </button>
    </div>
</main>

<!-- Footer -->
<footer class="w-full bottom-0 border-t border-outline-variant bg-background flex flex-col md:flex-row justify-between items-center gap-4 py-8 px-margin-mobile mt-auto">
    <div class="flex gap-md">
        <a class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors duration-200" href="#">Terms of Use</a>
        <a class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors duration-200" href="#">About Us</a>
    </div>
    <p class="font-label-sm text-label-sm text-on-surface-variant">© 2024 Aurelian Guide</p>
</footer>

<!-- ========== Registration Modal (hidden by default) ========== -->
<div id="register-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center" style="background:rgba(26,26,28,0.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);">
    <div id="register-dialog" class="animate-modal-in bg-white border border-[#E8E8E6] rounded-2xl p-8 mx-4 w-full max-w-sm shadow-sm">
        <div class="flex items-center justify-between mb-6">
            <h3 id="modal-title" class="text-lg font-medium" style="font-family: 'Noto Serif SC', serif;">输入你的名字</h3>
            <button id="modal-close" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-[20px] text-[#6F6F6F]">close</span>
            </button>
        </div>
        <p class="text-sm text-[#6F6F6F] mb-4">输入一个昵称，开始你的 AI 导览体验</p>
        <input id="modal-name" type="text" placeholder="请输入昵称（至少2个字）" autocomplete="off"
            class="w-full px-4 py-3 border border-[#E8E8E6] rounded-lg text-sm outline-none transition-colors focus:border-[#E07B3C] bg-[#FAFAF7] mb-4"
            style="font-family: 'Noto Sans SC', sans-serif;">
        <p id="modal-error" class="text-xs text-[#F87171] mb-3 hidden"></p>
        <button id="modal-submit"
            class="w-full py-3 bg-[#E07B3C] text-white rounded-lg text-sm font-medium hover:opacity-85 transition-opacity disabled:opacity-50"
            style="font-family: Inter, sans-serif;">
            开始导览
        </button>
    </div>
</div>

<!-- ========== Scripts ========== -->

<script src="../../assets/js/api-client.js"></script>

<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/router.js"></script>
<script src="../../assets/js/components.js"></script>
<script src="../../assets/js/pages/landing.js"></script>
</body></html>
